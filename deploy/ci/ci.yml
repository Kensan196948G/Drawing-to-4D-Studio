# CI ワークフロー（人間適用テンプレート）
#
# このファイルは `.github/workflows/ci.yml` へコピーして使用する。
# 理由: この開発環境の self-evolution policy gate は `.github/workflows/**` への
# 書込みを DEPLOY=critical として常時拒否する（AI からの適用は不可）。
# 内容はリポジトリの検証手順と同一。ポリシーが許可された環境では
# `cp deploy/ci/ci.yml .github/workflows/ci.yml` で適用する。

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/d4d_studio_test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/d4d_studio_test

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: d4d_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Approve esbuild build scripts
        run: pnpm approve-builds --all

      - name: Reinstall (build scripts approved)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Migration (empty DB)
        run: pnpm exec tsx scripts/db.ts migrate

      - name: Seed
        run: pnpm exec tsx scripts/db.ts seed

      - name: DB verify
        run: pnpm exec tsx scripts/db.ts verify

      - name: Migration again (idempotent)
        run: pnpm exec tsx scripts/db.ts migrate

      - name: Seed again (idempotent)
        run: pnpm exec tsx scripts/db.ts seed

      - name: Integration tests
        run: pnpm exec vitest run --config vitest.integration.config.ts

      - name: Build
        run: pnpm run build

      - name: Secret scan
        run: pnpm run secret-scan

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: d4d_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Approve esbuild build scripts
        run: pnpm approve-builds --all

      - name: Reinstall (build scripts approved)
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm run build:web

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm exec playwright test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/d4d_studio_test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/d4d_studio_test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
