<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="2D施工計画図（DXF）と工程表（CSV）から施工順序が伝わる4Dを作る Drawing-to-4D Studio">
    <title>Drawing-to-4D Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231c5d86'/%3E%3Cpath d='M8 27l12 6 12-6M8 27l12-6 12 6' fill='none' stroke='%237fb6dc' stroke-width='2'/%3E%3Cpath d='M20 7l10 5v10l-10 5-10-5V12z' fill='%23e4570b'/%3E%3C/svg%3E">
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ</a>
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="1" y="1" width="38" height="38" rx="10" fill="#1c5d86"></rect>
          <path d="M8 27l12 6 12-6M8 27l12-6 12 6" fill="none" stroke="#7fb6dc" stroke-width="1.6" stroke-linejoin="round"></path>
          <path d="M20 7l10 5v10l-10 5-10-5V12z" fill="#e4570b"></path>
          <path d="M20 17v10M30 12l-10 5-10-5" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"></path>
        </svg>
        <div class="brand-text">
          <b>Drawing-to-4D Studio</b>
          <small>2D施工計画図 4D化 / Phase 1</small>
        </div>
      </div>
      <span class="offline-badge" id="offline-badge">
        <svg class="i" aria-hidden="true"><use href="#i-lock"></use></svg>
        完全オフライン・図面は外に出ません
      </span>
      <div class="kpis" aria-label="集計">
        <div class="kpi"><span class="kpi-label"><svg class="i" aria-hidden="true"><use href="#i-grid"></use></svg>図面要素</span><b id="kpi-entities">0</b></div>
        <div class="kpi"><span class="kpi-label"><svg class="i" aria-hidden="true"><use href="#i-layers"></use></svg>工種</span><b id="kpi-worktypes">0</b></div>
        <div class="kpi"><span class="kpi-label"><svg class="i" aria-hidden="true"><use href="#i-cube"></use></svg>3D部材</span><b id="kpi-parts">0</b></div>
        <div class="kpi"><span class="kpi-label"><svg class="i" aria-hidden="true"><use href="#i-calendar"></use></svg>工程</span><b id="kpi-rows">0</b></div>
        <div class="kpi warn"><span class="kpi-label"><svg class="i" aria-hidden="true"><use href="#i-alert"></use></svg>確認待ち</span><b id="kpi-pending">0</b></div>
      </div>
      <div class="top-actions">
        <span class="api-status" id="api-status" data-state="unknown" title="サーバ接続の状態"><span class="dot" aria-hidden="true"></span><span id="api-status-label">API 確認中</span></span>
        <button class="btn s" id="btn-save" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-save"></use></svg>保存
        </button>
        <button class="btn s" id="btn-open" type="button">
          <svg class="i" aria-hidden="true"><use href="#i-open"></use></svg>開く
        </button>
        <button class="btn s icon" id="btn-theme" type="button" aria-label="表示の明るさを切り替える">
          <svg class="i theme-icon" aria-hidden="true" data-theme-icon><use href="#i-sun"></use></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <nav class="steps" id="step-nav" aria-label="作業のステップ"></nav>
      <main id="main" tabindex="-1"></main>
    </div>

    <dialog id="save-dialog" class="dlg" aria-labelledby="save-title">
      <form id="save-form" method="dialog">
        <div class="dlg-title"><span class="dlg-ico"><svg class="i" aria-hidden="true"><use href="#i-save"></use></svg></span><h2 id="save-title">案件を保存</h2></div>
        <p class="muted">図面・工程・工種・標高をこのブラウザに保存します。API接続時はサーバにも保存します。</p>
        <label class="field">
          <span>案件コード</span>
          <input id="case-code" name="code" type="text" required pattern="[A-Za-z0-9_-]{1,40}" maxlength="40" autocomplete="off">
        </label>
        <label class="field">
          <span>案件名</span>
          <input id="case-name" name="name" type="text" required maxlength="200">
        </label>
        <label class="field">
          <span>説明（任意）</span>
          <textarea id="case-desc" name="description" rows="2" maxlength="2000"></textarea>
        </label>
        <p class="form-error" id="save-error" role="alert" hidden></p>
        <div class="dlg-actions">
          <button class="btn" type="button" data-close="save-dialog">キャンセル</button>
          <button class="btn p" type="submit" id="save-submit"><svg class="i" aria-hidden="true"><use href="#i-check"></use></svg>保存する</button>
        </div>
      </form>
    </dialog>

    <dialog id="open-dialog" class="dlg wide" aria-labelledby="open-title">
      <div class="dlg-head">
        <span class="dlg-ico"><svg class="i" aria-hidden="true"><use href="#i-open"></use></svg></span>
        <h2 id="open-title">案件を開く</h2>
        <button class="btn s" type="button" data-close="open-dialog"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg>閉じる</button>
      </div>
      <p class="muted">このブラウザに保存した案件と、API接続時のサーバ案件を表示します。</p>
      <div id="open-list" class="case-list" aria-live="polite"></div>
    </dialog>

    <dialog id="confirm-dialog" class="dlg" aria-labelledby="confirm-title">
      <div class="dlg-title"><span class="dlg-ico warn"><svg class="i" aria-hidden="true"><use href="#i-alert"></use></svg></span><h2 id="confirm-title">確認</h2></div>
      <p id="confirm-body"></p>
      <div class="dlg-actions">
        <button class="btn" type="button" data-close="confirm-dialog">戻る</button>
        <button class="btn danger" type="button" id="confirm-ok">続行する</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v6h8M8 21v-7h8v7" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 3v6h6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 10v5M12 18h.01" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 13l9 5 9-5M3 17.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 22V12M21 7l-9 5-9-5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
        <symbol id="i-wand" viewBox="0 0 24 24"><path d="M15 4V2M15 10V8M11 6h2M17 6h2M3 21l12-12" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.7 8.7 0 1 0 11.3 11.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 4.5v3M15.5 6h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
        <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 12.2l2.7 2.7L16 9.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v6M12 7.6h.01" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 16.5 16.5 3 21 7.5 7.5 21z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 13.5l2 2M10.5 10.5l2 2M13.5 7.5l2 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
        <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5.3l3.4 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-server" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 7.2h.01M7 16.8h.01M11 7.2h4M11 16.8h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
        <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.7 4.6L18 9.3l-4.3 1.7L12 15.6l-1.7-4.6L6 9.3l4.3-1.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M18.5 15.5l.8 2.1 2.2.8-2.2.8-.8 2.1-.8-2.1-2.2-.8 2.2-.8z" fill="currentColor"/></symbol>
        <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 3v18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M6 4.5h11l-2.2 3.6L17 12H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
        <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="9" y="2.5" width="6" height="4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 11h7M8.5 15h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="4.3" cy="6" r="1.3" fill="currentColor"/><circle cx="4.3" cy="12" r="1.3" fill="currentColor"/><circle cx="4.3" cy="18" r="1.3" fill="currentColor"/></symbol>
      </defs>
    </svg>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
